name: Lighthouse Agentic Browsing

# Phase 2 GEO rollout — DR-NRPG enrichment.
# Pattern mirrors DR / Synthex / ATO / RestoreAssist / CCW / Unite-Hub / CARSI PRs.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/src/**'
      - 'apps/web/public/llms.txt'
      - 'apps/web/next.config.*'
      - '.github/workflows/lighthouse-agentic.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-agentic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentic-audit:
    name: Agentic Browsing audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      deployments: read
      statuses: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine target URL
        id: target
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # head_ref is attacker-controllable (PR branch name); pass via env and
          # reference the shell variable to avoid script injection [actionlint:expression]
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            URL=""
            for i in {1..15}; do
              URL=$(gh api "repos/${{ github.repository }}/deployments?ref=${HEAD_REF}&per_page=5" \
                --jq '.[0].payload.web_url // empty' 2>/dev/null || true)
              if [ -n "$URL" ]; then echo "Found: $URL"; break; fi
              sleep 20
            done
            if [ -z "$URL" ]; then
              echo "::warning::Could not resolve Vercel preview URL — informational only"
              echo "url=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            URL="https://dr-nrpg-platform.vercel.app"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Lighthouse CI
        if: steps.target.outputs.url != ''
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            ${{ steps.target.outputs.url }}/
            ${{ steps.target.outputs.url }}/contact
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouseagenticrc.json

      - name: Probe llms.txt + WebMCP + JSON-LD presence
        if: steps.target.outputs.url != ''
        env:
          URL: ${{ steps.target.outputs.url }}
        # DR-989: every fetch retries transient network/TLS errors (e.g. curl exit
        # 35) and HTTP 408/429/5xx before giving up, so one hiccup no longer turns
        # main red. No --fail: a 404 is not retried, it is returned as a status
        # code and judged below. A network error that outlasts the retries, a
        # missing or short llms.txt, or a page with no JSON-LD still fails the job.
        run: |
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          WORK=$(mktemp -d)
          FAILED=0
          fetch() { # fetch <path> <outfile>: prints the HTTP status; returns curl's exit code
            curl -sS -o "$2" -w '%{http_code}' \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 20 "$URL$1"
          }
          network_fail() { # network_fail <path> <curl exit>
            echo "- ❌ \`$1\` network error: curl exit $2 after 3 retries (not a content check)" >> "$SUMMARY"
            echo "::error::Network error fetching $URL$1 (curl exit $2) after 3 retries"
            FAILED=1
          }

          echo "## Agentic Browsing pre-checks" >> "$SUMMARY"

          LLMS_RC=0
          LLMS_STATUS=$(fetch /llms.txt "$WORK/llms.txt") || LLMS_RC=$?
          if [ "$LLMS_RC" -ne 0 ]; then
            network_fail /llms.txt "$LLMS_RC"
          else
            LLMS_SIZE=$(wc -c < "$WORK/llms.txt" | tr -d ' ')
            if [ "$LLMS_STATUS" = "200" ] && [ "$LLMS_SIZE" -gt 1000 ]; then
              echo "- ✅ \`llms.txt\` ${LLMS_SIZE} bytes" >> "$SUMMARY"
            else
              echo "- ❌ \`llms.txt\` HTTP $LLMS_STATUS, size=$LLMS_SIZE" >> "$SUMMARY"
              echo "::error::llms.txt missing or too small: HTTP $LLMS_STATUS, $LLMS_SIZE bytes (need 200 and >1000)"
              FAILED=1
            fi
          fi

          CONTACT_RC=0
          CONTACT_STATUS=$(fetch /contact "$WORK/contact.html") || CONTACT_RC=$?
          if [ "$CONTACT_RC" -ne 0 ]; then
            network_fail /contact "$CONTACT_RC"
          elif grep -q 'toolname=' "$WORK/contact.html"; then
            echo "- ✅ WebMCP toolname on /contact" >> "$SUMMARY"
          else
            # Informational, as before: reported but does not fail the job.
            echo "- ❌ No WebMCP on /contact (HTTP $CONTACT_STATUS)" >> "$SUMMARY"
          fi

          HOME_RC=0
          HOME_STATUS=$(fetch / "$WORK/home.html") || HOME_RC=$?
          if [ "$HOME_RC" -ne 0 ]; then
            network_fail / "$HOME_RC"
          else
            JSONLD_COUNT=$(grep -c 'application/ld+json' "$WORK/home.html" || true)
            echo "- JSON-LD on /: ${JSONLD_COUNT} (HTTP $HOME_STATUS)" >> "$SUMMARY"
            if [ "$JSONLD_COUNT" -eq 0 ]; then
              echo "::error::No JSON-LD on / (HTTP $HOME_STATUS)"
              FAILED=1
            fi
          fi

          exit "$FAILED"
