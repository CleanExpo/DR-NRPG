name: Deploy Preview

on:
  # Gated to workflow_dispatch only on 2026-05-25 because GitHub was
  # creating empty-jobs failure runs on every main-branch push despite
  # the `pull_request` trigger only matching PR events. Until that
  # anomaly is understood, keep branch pushes attached to a guard job
  # and keep actual preview deployment callable manually.
  push:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  trigger-guard:
    name: Trigger Guard
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only preview deployment
        run: |
          echo "Guard job present so ruleset-triggered runs never fail with zero jobs."
          echo "Actual preview deployment runs only when deployment secrets and job conditions match."

  # Secrets cannot be referenced in job-level `if:` conditionals, so we read
  # the token inside a step (where the secrets context is available) and expose
  # a boolean output that downstream jobs gate on via `needs`.
  check-secrets:
    name: Check Deploy Secrets
    runs-on: ubuntu-latest
    outputs:
      has_vercel: ${{ steps.check.outputs.has_vercel }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vercel=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-preview:
    name: Deploy to Vercel Preview
    runs-on: ubuntu-latest
    # Manual-only: on push, only trigger-guard/check-secrets run (Vercel's native
    # git integration handles push deploys). Actual CLI deploy runs on dispatch.
    needs: check-secrets
    if: needs.check-secrets.outputs.has_vercel == 'true' && github.event_name == 'workflow_dispatch'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm  # RA-3004 2026-05-12
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # version is read from package.json#packageManager (pnpm@9.15.9) — single SSOT
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $PREVIEW_URL"

      - name: Comment PR with Preview URL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview-url }}';
            const comment = `## Preview Deployment

            Your preview deployment is ready!

            **Preview URL:** ${previewUrl}

            **Environment:** Preview
            **Commit:** ${context.sha.substring(0, 7)}
            **Branch:** ${context.ref.replace('refs/heads/', '')}

            ---

            *Deployed by Vercel*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lighthouse-preview:
    name: Lighthouse Audit on Preview
    runs-on: ubuntu-latest
    needs: [check-secrets, deploy-preview]
    if: needs.check-secrets.outputs.has_vercel == 'true' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Wait for deployment
        run: sleep 30

      - name: Run Lighthouse CI
        run: lhci autorun --collect.url=${{ needs.deploy-preview.outputs.preview-url }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-preview-results
          path: .lighthouseci
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsPath = '.lighthouseci';
            if (!fs.existsSync(resultsPath)) {
              console.log('No Lighthouse results found');
              return;
            }

            const manifestPath = path.join(resultsPath, 'manifest.json');
            if (!fs.existsSync(manifestPath)) {
              console.log('No manifest file found');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const reportFiles = manifest.map(entry => entry.jsonPath);

            let comment = '## Lighthouse CI Results (Preview)\n\n';

            reportFiles.forEach((file, index) => {
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              const categories = report.categories;

              comment += '| Category | Score |\n';
              comment += '|----------|-------|\n';

              Object.entries(categories).forEach(([key, category]) => {
                const score = Math.round(category.score * 100);
                const emoji = score >= 90 ? '🟢' : score >= 50 ? '🟡' : '🔴';
                comment += `| ${emoji} ${category.title} | ${score} |\n`;
              });
            });

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  smoke-tests:
    name: Smoke Tests on Preview
    runs-on: ubuntu-latest
    needs: [check-secrets, deploy-preview]
    if: needs.check-secrets.outputs.has_vercel == 'true' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: |
          PREVIEW_URL="${{ needs.deploy-preview.outputs.preview-url }}"

          curl -f -s -o /dev/null -w "%{http_code}" $PREVIEW_URL || exit 1
          curl -f -s -o /dev/null -w "%{http_code}" $PREVIEW_URL/api/health || exit 1

          echo "Smoke tests passed!"
