name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded in-flight production deploy when a newer commit lands on
# main. Without this, a burst of pushes stacks N full `vercel build`+upload runs,
# which on 2026-06-23 drained Vercel's 40k upload quota (code: api-upload-paid)
# and 24h-throttled all production deploys. One deploy in flight at a time.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # DR-905: the contractor go-live e2e proof gates production promotion.
  # Same infra as the PR-blocking `go-live-proof` job in test-all.yml
  # (ephemeral Postgres service + local `next dev` webServer) — no new
  # secrets or environments. If this gate fails, deploy-production never runs.
  go-live-gate:
    name: Go-Live E2E Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: nrpg_golive
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm --filter nrpg-web exec playwright install --with-deps chromium
      - name: Generate Prisma Client
        run: pnpm run db:generate
      - name: Push database schema
        run: pnpm --filter nrpg-web exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/nrpg_golive
          DIRECT_URL: postgresql://e2e:e2e@localhost:5432/nrpg_golive
      - name: Run go-live proof (blocking, retries=0, zero-residual teardown)
        run: pnpm --filter nrpg-web exec playwright test --project=golive-proof
        env:
          CI: true
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/nrpg_golive
          DIRECT_URL: postgresql://e2e:e2e@localhost:5432/nrpg_golive
      - name: Upload go-live gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golive-gate-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30

  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    # DR-905: production deploy is blocked unless the go-live e2e gate passes.
    needs: go-live-gate
    environment:
      name: production
      url: https://dr-nrpg-platform.vercel.app
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm  # RA-3004 2026-05-12
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # version is read from package.json#packageManager (pnpm@9.15.9) — single SSOT
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: deploy
        # DR-932: `vercel deploy` can exit non-zero when an upload retry aborts even
        # though the deployment proceeds server-side and reaches READY. This script
        # falls back to polling the Vercel API for a READY deployment matching this
        # commit, so an upload-retry false-negative no longer fails a deploy that
        # actually succeeded. See scripts/vercel-deploy-prod.sh.
        # VERCEL_ORG_ID / VERCEL_PROJECT_ID come from the top-level env: block.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PRODUCTION_URL=$(bash scripts/vercel-deploy-prod.sh)
          echo "production-url=$PRODUCTION_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $PRODUCTION_URL"

      - name: Create deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.production-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for deployment to stabilize
        run: sleep 60

      - name: Run smoke tests
        run: |
          PRODUCTION_URL="https://dr-nrpg-platform.vercel.app"

          echo "Testing $PRODUCTION_URL..."

          # Test homepage
          HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" $PRODUCTION_URL)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Homepage test failed with code: $HTTP_CODE"
            exit 1
          fi
          echo "✅ Homepage: $HTTP_CODE"

          # Test API health endpoint.
          # Stripe is owner-gated (DR-901: live price IDs not yet set), so
          # /api/health returns 503 with checks.stripe.status=unhealthy
          # (reason=not_configured) BY DESIGN. A blanket `!= 200` check therefore
          # red-flagged every production deploy even though the site and every
          # core subsystem were healthy. Fail only when a NON-owner-gated
          # subsystem (database / storage / api) is unhealthy or the endpoint is
          # unreachable; treat a stripe-only 503 as a WARN. Remove this tolerance
          # once DR-901 configures Stripe and /api/health returns 200.
          HEALTH_JSON=$(curl -s "$PRODUCTION_URL/api/health")
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/api/health")
          echo "Health endpoint: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health endpoint: 200"
          else
            DB=$(echo "$HEALTH_JSON" | jq -r '.checks.database.status // "unknown"')
            STORAGE=$(echo "$HEALTH_JSON" | jq -r '.checks.storage.status // "unknown"')
            API=$(echo "$HEALTH_JSON" | jq -r '.checks.api.status // "unknown"')
            STRIPE=$(echo "$HEALTH_JSON" | jq -r '.checks.stripe.status // "unknown"')
            STRIPE_REASON=$(echo "$HEALTH_JSON" | jq -r '.checks.stripe.reason // ""')
            if [ "$DB" = "healthy" ] && [ "$STORAGE" = "healthy" ] && [ "$API" = "healthy" ] \
               && [ "$STRIPE" = "unhealthy" ] && [ "$STRIPE_REASON" = "not_configured" ]; then
              echo "⚠️  Health is $HTTP_CODE, but the only unhealthy subsystem is stripe=not_configured"
              echo "    (owner-gated, DR-901). Core subsystems healthy (db/$DB storage/$STORAGE api/$API)."
              echo "    Treating as WARN, not a deploy failure."
            else
              echo "❌ Health endpoint failed ($HTTP_CODE) with a non-owner-gated subsystem unhealthy:"
              echo "    database=$DB storage=$STORAGE api=$API stripe=$STRIPE/$STRIPE_REASON"
              exit 1
            fi
          fi

          # Test critical pages
          for page in "/about" "/pricing" "/contact"; do
            HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL$page" || echo "failed")
            echo "Page $page: $HTTP_CODE"
          done

          echo "✅ All smoke tests passed!"

  env-parity:
    name: Env-Parity Gate (report-only)
    runs-on: ubuntu-latest
    needs: deploy-production
    # DR-860 / DR-907: verify the DEPLOYED production env resolves correctly —
    # /api/health subsystems, NEXTAUTH_URL origin, auth provider URLs, csrf —
    # from OUTSIDE via public GETs (no secrets). Probes the canonical origin
    # https://nrpg.business (that is where NEXTAUTH_URL resolves; the vercel
    # alias would false-fail the auth-origin check).
    #
    # REPORT-ONLY (continue-on-error) for now: the Stripe subsystem is
    # owner-gated (DR-901 — live price IDs not yet set), so /api/health returns
    # 503 and the gate exits non-zero by design. A hard gate today would red
    # every prod deploy over a known owner-gated condition. Positive control
    # 2026-07-17 against https://nrpg.business: 7 PASS / 6 WARN / 2 FAIL, and
    # BOTH fails are the Stripe cascade — every env/auth-origin/csrf check
    # passes. Flip to blocking (remove continue-on-error on the run step) once
    # DR-901 lands the Stripe price IDs.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wait for deployment to stabilize
        run: sleep 60
      - name: Run env-parity gate (report-only until DR-901)
        continue-on-error: true
        run: |
          pnpm --filter nrpg-web run env-parity https://nrpg.business --json \
            | tee env-parity-prod.json
      - name: Publish env-parity summary
        if: always()
        run: |
          {
            echo "## Env-Parity Gate — production (report-only)"
            echo '```'
            cat env-parity-prod.json 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload env-parity evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: env-parity-production
          path: env-parity-prod.json
          retention-days: 90

  performance-check:
    name: Performance Validation
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # lhci autorun inspects package.json#packageManager (pnpm@9.15.9) and
        # shells out to pnpm; without this the step fails with `pnpm: not found`.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Wait for deployment
        run: sleep 60

      - name: Run Lighthouse on production
        # A perf-budget miss against the live URL must REPORT, not fail the deploy run.
        # Deploy + smoke-tests are the real gates; Lighthouse is advisory. Without this,
        # every prod deploy shows run conclusion=failure even when deploy+smoke pass.
        # Scoped to this step (not the job) so genuine infra breakage (pnpm/node/lhci
        # install) still fails visibly.
        continue-on-error: true
        run: |
          lhci autorun --collect.url=https://dr-nrpg-platform.vercel.app
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-production-results
          path: .lighthouseci
          retention-days: 90

  notify-deployment:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-tests, performance-check]
    if: always()
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Production Deployment ${{ needs.deploy-production.result == 'success' && 'Successful' || 'Failed' }}"
          description: |
            **Status:** ${{ needs.deploy-production.result }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Deployed by:** ${{ github.actor }}
          color: ${{ needs.deploy-production.result == 'success' && '0x00ff00' || '0xff0000' }}
        continue-on-error: true
