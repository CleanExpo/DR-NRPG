name: Automated Database Backup

on:
  schedule:
    # Run daily at 2 AM UTC (~12 PM AEST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: backup
  cancel-in-progress: false

# Why GitHub Actions artifact, not AWS S3
# --------------------------------------
# The previous version uploaded pg_dumps to AWS S3 using apt-installed
# postgresql-client-17 + awscli. Three stacked failures kept every scheduled
# run broken for weeks: postgresql-client-17 not in Ubuntu 24.04 apt, awscli
# package removed from Ubuntu 24.04, and no AWS credentials configured on
# this account (DR-NRPG infra is Supabase + Docker, not AWS).
#
# This version:
#   - Uses the official PostgreSQL APT repo to get postgresql-client-17.
#   - Runs pg_dump against DIRECT_URL_PRODUCTION.
#   - Uploads the compressed dump as a GitHub Actions artifact (zero new
#     credentials; 90-day retention by default; downloadable via UI or gh cli).
#
# Supabase also provides native daily backups + PITR on Pro plans. This
# artifact is a redundant safety net the team controls directly.

permissions:
  contents: read

jobs:
  backup:
    name: Backup Production Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          # Ubuntu 24.04 does not ship postgresql-client-17 in default apt
          # sources. Add the official PostgreSQL APT repo with GPG verification.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          sudo sh -c "echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17 > /dev/null
          # The /usr/bin/pg_dump wrapper on Ubuntu runners resolves to 16.13
          # even after 17 is installed (pre-installed postgresql-client-common
          # keeps it pinned). Prepend 17's binaries to PATH so the right
          # version wins every subsequent step.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Validate backup database secret
        env:
          DIRECT_URL_PRODUCTION: ${{ secrets.DIRECT_URL_PRODUCTION }}
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DIRECT_URL_PRODUCTION:-}" ]; then
            echo "::error::DIRECT_URL_PRODUCTION is required for database backups. Set it to the Supabase Postgres connection string from Database > Connect using the current database password. Do not use the anon key, service-role key, or an app URL."
            if [ -n "${DATABASE_URL_PRODUCTION:-}" ] || [ -n "${DATABASE_URL_PROD:-}" ]; then
              echo "::notice::A pooled application DATABASE_URL secret appears to exist, but pg_dump backups intentionally require DIRECT_URL_PRODUCTION so they do not silently use the wrong Supabase credential path."
            fi
            exit 1
          fi

          if [[ ! "$DIRECT_URL_PRODUCTION" =~ ^postgres(ql)?:// ]]; then
            echo "::error::DIRECT_URL_PRODUCTION must be a PostgreSQL connection string beginning with postgresql:// or postgres://."
            exit 1
          fi

          if [[ "$DIRECT_URL_PRODUCTION" == *"pgbouncer=true"* ]] || [[ "$DIRECT_URL_PRODUCTION" == *":6543/"* ]]; then
            echo "::error::DIRECT_URL_PRODUCTION points at a transaction-pooler style URL. For Supabase pg_dump, use the Direct connection string, or the Session pooler on port 5432 if the runner cannot reach IPv6."
            exit 1
          fi

      - name: Run pg_dump
        id: dump
        env:
          # Supabase-specific: pg_dump must use a database password connection
          # string, not Supabase API keys. DIRECT_URL_PRODUCTION is the repo's
          # existing production secret contract for direct database access.
          DATABASE_URL: ${{ secrets.DIRECT_URL_PRODUCTION }}
        # pipefail is mandatory: `pg_dump | gzip` will otherwise report success
        # even when pg_dump fails (the 1st backup run on this workflow produced
        # a 20-byte empty-gzip artifact and reported green — classic silent-
        # success trap, see RA-1109). pg_dump is now run standalone, then
        # gzipped separately so errors surface at the right step.
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DIRECT_URL_PRODUCTION secret is not set on this repo."
            exit 1
          fi

          redact_pg_output() {
            sed -E \
              -e 's#(postgres(ql)?://[^:[:space:]]+):[^@[:space:]]+@#\1:***@#g' \
              -e 's#(password=)[^[:space:]]+#\1***#Ig'
          }

          TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          PLAIN="dr-nrpg-db-${TIMESTAMP}.sql"
          FILE="${PLAIN}.gz"
          PG_DUMP_LOG="pg-dump-error-${TIMESTAMP}.log"

          # Run pg_dump standalone — exit non-zero on any failure.
          # --no-owner/--no-privileges make the dump restorable to a different role.
          echo "Running pg_dump…"
          if ! pg_dump "$DATABASE_URL" \
            --no-owner --no-privileges --format=plain \
            --file="$PLAIN" \
            2> "$PG_DUMP_LOG"; then
            if grep -qi "password authentication failed" "$PG_DUMP_LOG"; then
              echo "::error::pg_dump failed password authentication. Update DIRECT_URL_PRODUCTION with the current Supabase database password from Database > Connect. Do not paste NEXT_PUBLIC_SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY."
            else
              echo "::error::pg_dump failed before a backup file was produced. Check that DIRECT_URL_PRODUCTION is the Supabase Direct connection string, or the Session pooler on port 5432 for IPv4-only runners."
            fi
            echo "--- sanitized pg_dump stderr (last 40 lines) ---"
            tail -40 "$PG_DUMP_LOG" | redact_pg_output
            exit 1
          fi

          PLAIN_BYTES=$(stat -c %s "$PLAIN")
          echo "pg_dump produced $PLAIN_BYTES bytes"

          # Sanity gate: a real DR-NRPG dump should be substantially larger
          # than any conceivable empty-schema output. 1 KB is a conservative
          # floor — the dump header alone normally runs > 200 lines of SQL.
          if [ "$PLAIN_BYTES" -lt 1024 ]; then
            echo "::error::pg_dump output suspiciously small ($PLAIN_BYTES bytes). Aborting to prevent uploading a silent-success empty backup."
            echo "--- first 20 lines of dump ---"
            head -20 "$PLAIN" || true
            exit 1
          fi

          # Compress the verified dump
          gzip -9 "$PLAIN"
          COMPRESSED_BYTES=$(stat -c %s "$FILE")
          echo "Compressed: $COMPRESSED_BYTES bytes"

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "bytes=$COMPRESSED_BYTES" >> "$GITHUB_OUTPUT"
          echo "plain_bytes=$PLAIN_BYTES" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dr-nrpg-db-${{ github.run_id }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      - name: Print restore instructions
        run: |
          echo "## Backup complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "File: \`${{ steps.dump.outputs.file }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: \`${{ steps.dump.outputs.bytes }}\` bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### To restore" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo 'gh run download ${{ github.run_id }} --repo CleanExpo/DR-NRPG --name dr-nrpg-db-${{ github.run_id }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'gunzip -c ${{ steps.dump.outputs.file }} | psql "$TARGET_DATABASE_URL"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact retained for 30 days." >> "$GITHUB_STEP_SUMMARY"
