name: Health - Post-Deployment Checks

# HEALTH_CHECK_URL (repo variable) is the deployed origin this workflow probes.
# Default is DR-NRPG's own Vercel production URL (per deploy-production.yml's
# environment.url). The previous default — https://disasterrecovery.com.au —
# pointed at a domain owned by the separate `Disaster-Recovery` repo, which
# does not expose /api/health, so every scheduled ping returned 404 and turned
# the main-branch run red on a 5-minute cadence. Override via repo variable
# if/when DR-NRPG attaches a custom production domain.
env:
  HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL || 'https://dr-nrpg-platform.vercel.app' }}

on:
  workflow_run:
    workflows: [ "Deploy Production" ]
    types: [ completed ]

  # Scheduled ping is gated on a successful production deploy existing.
  # Re-enable by uncommenting once Deploy Production is green and the
  # HEALTH_CHECK_URL env above points at a live origin. Until then a 5-min
  # cron against a non-existent deployment turns the main-branch run red
  # 288 times a day with no actionable signal.
  # schedule:
  #   - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  scheduled-ping:
    name: Scheduled Health Ping
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Ping /api/health
        id: ping
        run: |
          response=$(curl -s -w "\n%{http_code}" "$HEALTH_CHECK_URL/api/health")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Health check failed with status $http_code"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        run: |
          echo "::error::ALERT — production health check failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  health-check:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm  # RA-3004 2026-05-12
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # version is read from package.json#packageManager (pnpm@9.15.9) — single SSOT
      - name: Wait for deployment
        run: sleep 30

      - name: Check API health
        run: |
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts"
            response=$(curl -s -w "\n%{http_code}" "$HEALTH_CHECK_URL/api/health")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            echo "HTTP Status: $http_code"
            echo "Response: $body"

            if [ "$http_code" = "200" ] || [ "$http_code" = "503" ]; then
              echo "API is responding"
              break
            fi

            attempt=$((attempt + 1))
            if [ $attempt -le $max_attempts ]; then
              sleep 10
            fi
          done

          if [ "$http_code" != "200" ] && [ "$http_code" != "503" ]; then
            echo "Health check failed"
            exit 1
          fi

      - name: Check database connectivity
        run: |
          curl -s "$HEALTH_CHECK_URL/api/health" | grep -q '"database"'
          if [ $? -eq 0 ]; then
            echo "Database connectivity verified"
          else
            echo "Warning: Could not verify database"
            exit 1
          fi

      - name: Check metrics endpoint
        run: |
          curl -s "$HEALTH_CHECK_URL/api/metrics" | head -20
          if [ $? -eq 0 ]; then
            echo "Metrics endpoint is responding"
          else
            echo "Metrics endpoint failed"
            exit 1
          fi

      - name: Performance baseline check
        run: |
          response_time=$(curl -s -w '%{time_total}' -o /dev/null "$HEALTH_CHECK_URL/api/health")
          echo "API response time: $response_time seconds"

          if (( $(echo "$response_time > 5" | bc -l) )); then
            echo "Warning: Response time is slow"
          fi

      - name: Notify on success
        if: success()
        run: echo "Health check passed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Health check failed - deployment may have issues"
          exit 1
