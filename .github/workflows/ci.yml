name: CI - Lint, Test, Build

on:
  push:
    branches: [ main, develop, codex/nrpg-hall-receiving, codex/nrpg-hall-member-handoff, codex/nrpg-hall-coach8-exclusion ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'

jobs:
  # Catches GitHub Actions errors (e.g. `secrets` used in `if:`, bad expressions,
  # invalid refs) at PR time so they can never reach main as startup_failure runs.
  workflows-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (pinned)
        run: bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: Lint all workflows
        run: ./actionlint -shellcheck= -color

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run check:au-english

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm run test
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          CSRF_SECRET: test-csrf-secret-for-ci-minimum-32-chars
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          CSRF_SECRET: test-csrf-secret-for-ci-minimum-32-chars
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: apps/web/.next
          retention-days: 3
          include-hidden-files: true

  smoke-tests:
    name: Smoke Tests (DR-217)
    runs-on: ubuntu-latest
    needs: [build]
    # Real Postgres so the deep /api/health (DR-907) database probe is
    # GENUINELY healthy — the smoke suite asserts checks.database.status
    # === 'healthy', not just "some HTTP response".
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - name: Push database schema
        run: pnpm --filter nrpg-web exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke_test
          DIRECT_URL: postgresql://smoke:smoke@localhost:5432/smoke_test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: apps/web/.next
      - name: Start server and run smoke tests
        run: |
          REPO_ROOT=$(pwd)
          cd apps/web
          pnpm exec next start &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

          SMOKE_TEST_URL=http://localhost:3000 pnpm exec jest --config "$REPO_ROOT/jest.smoke.config.js" --verbose --forceExit

          kill $SERVER_PID 2>/dev/null || true
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://smoke:smoke@localhost:5432/smoke_test
          DIRECT_URL: postgresql://smoke:smoke@localhost:5432/smoke_test
          STRIPE_SECRET_KEY: sk_test_dummy_for_ci_smoke_tests
          CSRF_SECRET: test-csrf-secret-for-ci-minimum-32-chars
          JWT_SECRET: test-jwt-secret-for-ci-minimum-32-chars
          # DR-907 deep /api/health gates on database+stripe+storage. CI can
          # provision a real Postgres (database is asserted healthy above) but
          # has NO real Stripe or Supabase credentials (owner-gated secrets) —
          # the dummy STRIPE_SECRET_KEY exists only so stripe-importing routes
          # don't crash at module load. Declare exactly those two subsystems
          # as unprovisionable here; the smoke suite still requires database
          # healthy + status-code/body consistency, and deployed environments
          # (where this variable is unset) still require full health / 200.
          SMOKE_ALLOW_UNHEALTHY_SUBSYSTEMS: stripe,storage
