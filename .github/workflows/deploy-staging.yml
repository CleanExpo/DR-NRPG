name: Deploy Staging

on:
  # Gated to workflow_dispatch only on 2026-05-25 because GitHub was
  # creating empty-jobs failure runs on every main-branch push despite
  # `push.branches=[develop]` filter. Until that anomaly is understood,
  # keep branch pushes attached to a guard job and keep actual staging
  # deployment callable manually.
  push:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  trigger-guard:
    name: Trigger Guard
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only staging deployment
        run: |
          echo "Guard job present so ruleset-triggered runs never fail with zero jobs."
          echo "Actual staging deployment runs only when deployment secrets and job conditions match."

  # Secrets cannot be referenced in job-level `if:` conditionals, so we read
  # the token inside a step (where the secrets context is available) and expose
  # a boolean output that downstream jobs gate on via `needs`.
  check-secrets:
    name: Check Deploy Secrets
    runs-on: ubuntu-latest
    outputs:
      has_vercel: ${{ steps.check.outputs.has_vercel }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vercel=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-staging:
    name: Deploy to Vercel Staging
    runs-on: ubuntu-latest
    # Manual-only: on push, only trigger-guard/check-secrets run (Vercel's native
    # git integration handles push deploys). Actual CLI deploy runs on dispatch.
    needs: check-secrets
    if: needs.check-secrets.outputs.has_vercel == 'true' && github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.staging-url }}
    outputs:
      staging-url: ${{ steps.deploy.outputs.staging-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm  # RA-3004 2026-05-12
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # version is read from package.json#packageManager (pnpm@9.15.9) — single SSOT
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview (Staging)
        id: deploy
        run: |
          STAGING_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "staging-url=$STAGING_URL" >> $GITHUB_OUTPUT
          echo "Deployed staging to: $STAGING_URL"

      - name: Create deployment summary
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.staging-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** develop" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    name: Staging Smoke Tests
    runs-on: ubuntu-latest
    needs: [check-secrets, deploy-staging]
    if: needs.check-secrets.outputs.has_vercel == 'true' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: |
          STAGING_URL="${{ needs.deploy-staging.outputs.staging-url }}"
          echo "Testing $STAGING_URL..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Homepage test failed with code: $HTTP_CODE"
            exit 1
          fi
          echo "Homepage: $HTTP_CODE"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health")
          echo "Health endpoint: $HTTP_CODE"

          echo "Staging smoke tests passed!"

  env-parity:
    name: Env-Parity Gate (report-only)
    runs-on: ubuntu-latest
    needs: [check-secrets, deploy-staging]
    if: needs.check-secrets.outputs.has_vercel == 'true' && github.event_name == 'workflow_dispatch'
    # DR-860 / DR-907: verify the DEPLOYED staging env resolves correctly from
    # OUTSIDE via public GETs (no secrets). Probes the canonical staging origin
    # https://staging.disasterrecovery.com.au (where NEXTAUTH_URL resolves; the
    # ephemeral vercel alias would false-fail the auth-origin check).
    #
    # REPORT-ONLY (continue-on-error) — mirrors the production wiring. As of
    # 2026-07-17 the canonical staging domain is not yet a reachable deploy
    # (DR-860 owner-ask item 1), so this job is wired-but-inert until staging is
    # stood up. Flip to blocking once staging is live and Stripe is configured.
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Wait for deployment to stabilize
        run: sleep 30
      - name: Run env-parity gate (report-only)
        continue-on-error: true
        run: |
          pnpm --filter nrpg-web run env-parity https://staging.disasterrecovery.com.au --json \
            | tee env-parity-staging.json
      - name: Publish env-parity summary
        if: always()
        run: |
          {
            echo "## Env-Parity Gate — staging (report-only)"
            echo '```'
            cat env-parity-staging.json 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload env-parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: env-parity-staging
          path: env-parity-staging.json
          retention-days: 90
