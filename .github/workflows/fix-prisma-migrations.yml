name: Fix _prisma_migrations (one-shot)

on:
  workflow_dispatch:

jobs:
  fix-migrations:
    name: Insert missing _prisma_migrations rows
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run fix SQL
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL_PRODUCTION }}
        run: |
          psql "$DATABASE_URL" -f scripts/fix-prisma-migrations.sql

      - name: Verify all 14 migrations present
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL_PRODUCTION }}
        run: |
          COUNT=$(psql "$DATABASE_URL" -t -c "SELECT COUNT(*) FROM _prisma_migrations;")
          echo "Migration count: $COUNT"
          if [ "$(echo $COUNT | tr -d ' ')" -lt 14 ]; then
            echo "ERROR: Expected at least 14 migrations, got $COUNT"
            exit 1
          fi
          echo "All migrations present."
