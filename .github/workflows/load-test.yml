name: Load Testing

on:
  # schedule + pull_request triggers removed on 2026-05-25 because
  # GitHub was creating empty-jobs failure runs on every main-branch
  # push event despite neither trigger matching push. Keep branch pushes
  # attached to a guard job so required checks do not fail with zero jobs;
  # keep actual k6 runs manual-only.
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      scenario:
        description: 'Test scenario'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - matching
          - auth
          - database
          - signup-eligibility
      duration:
        description: 'Test duration (e.g., 10m, 1h)'
        required: false
        default: '10m'



env:
  K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
  BASE_URL_STAGING: https://staging.disasterrecovery.com.au
  BASE_URL_PRODUCTION: https://disaster-recovery-seven.vercel.app

jobs:
  trigger-guard:
    name: Trigger Guard
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual-only load testing
        run: |
          echo "Guard job present so ruleset-triggered runs never fail with zero jobs."
          echo "Actual k6 load tests run only when their scenario conditions match."

  # DR-906: validate k6 script syntax on every run of this workflow (including
  # branch pushes) so a broken scenario is caught in PR CI, not at dispatch time.
  k6-validate:
    name: K6 Script Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        # Install from Grafana's official apt repo instead of grafana/setup-k6-action@v1,
        # which downloads the k6 binary from the GitHub releases API and intermittently
        # fails the whole check on a 503 (unrelated to the script being validated).
        # Fetch the signing key over HTTPS and dearmor it locally rather than via a
        # keyserver: the runner has no dirmngr, so `gpg --recv-keys` fails with
        # "can't connect to the dirmngr". `curl | gpg --dearmor` needs neither a
        # keyserver nor dirmngr and is retried for network resilience.
        run: |
          curl -fsSL --retry 3 --retry-delay 2 https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Validate signup-eligibility scenario (k6 inspect)
        run: |
          cd load-tests
          k6 inspect scenarios/signup-eligibility.js

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    if: github.event_name == 'pull_request' || github.event.schedule || (github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'smoke')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm  # RA-3004 2026-05-12
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # version is read from package.json#packageManager (pnpm@9.15.9) — single SSOT
      - name: Setup k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run smoke test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/smoke-test.json \
            scenarios/smoke.js
        continue-on-error: true

      - name: Upload smoke test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('load-tests/reports/smoke-summary.json', 'utf8');
              const data = JSON.parse(summary);

              const comment = `## 🚀 Smoke Test Results

              | Metric | Value |
              |--------|-------|
              | Total Requests | ${data.metrics?.http_reqs?.values?.count || 'N/A'} |
              | Avg Response Time | ${(data.metrics?.http_req_duration?.values?.avg || 0).toFixed(2)}ms |
              | P95 Response Time | ${(data.metrics?.http_req_duration?.values?.['p(95)'] || 0).toFixed(2)}ms |
              | Error Rate | ${((data.metrics?.http_req_failed?.values?.rate || 0) * 100).toFixed(2)}% |

              <details>
              <summary>View detailed results</summary>

              \`\`\`json
              ${JSON.stringify(data.metrics, null, 2).slice(0, 3000)}
              \`\`\`
              </details>
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Could not read results file:', e.message);
            }

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'load'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run claim submission load test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/load-test.json \
            scenarios/claim-submission.js

      - name: Upload load test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'stress'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run database stress test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/stress-test.json \
            stress/database-pooling.js

      - name: Upload stress test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stress-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  matching-test:
    name: Contractor Matching Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'matching'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run contractor matching test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/matching-test.json \
            scenarios/contractor-matching.js

      - name: Upload matching test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: matching-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  auth-test:
    name: Authentication Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'auth'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1

      - name: Set environment URL
        id: set-url
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "BASE_URL=${{ env.BASE_URL_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_URL=${{ env.BASE_URL_STAGING }}" >> $GITHUB_OUTPUT
          fi

      - name: Run authentication test
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ steps.set-url.outputs.BASE_URL }} \
            --out json=reports/auth-test.json \
            scenarios/authentication.js

      - name: Upload auth test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: auth-test-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  # DR-906: signup -> eligibility journey + duplicate-signup race under load.
  # STAGING ONLY — this job deliberately ignores the `environment` input and
  # pins BASE_URL to staging so contractor-signup load can never hit production.
  # No continue-on-error: a breached threshold (p95<800ms, error rate<1%,
  # zero 5xx, zero duplicate accounts) turns this job red.
  signup-eligibility-test:
    name: Signup Eligibility Load Test (DR-906)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.scenario == 'signup-eligibility'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup k6
        uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1

      - name: Refuse production targets
        if: github.event.inputs.environment == 'production'
        run: |
          echo "::error::DR-906 signup-eligibility load test may only run against staging."
          exit 1

      - name: Run signup -> eligibility load test (staging only)
        run: |
          cd load-tests
          k6 run \
            --env BASE_URL=${{ env.BASE_URL_STAGING }} \
            --out json=reports/signup-eligibility.json \
            scenarios/signup-eligibility.js

      - name: Upload signup-eligibility results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: signup-eligibility-results-${{ github.run_id }}
          path: load-tests/reports/
          retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [smoke-test, load-test, stress-test, matching-test, auth-test, signup-eligibility-test]
    if: always()
    # Secrets cannot be referenced in `if:` conditionals; map to a job-level
    # env var and gate the step on env instead.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Post to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          payload: |
            {
              "text": "Load Test Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Load Test Results*\n\n- Environment: ${{ github.event.inputs.environment || 'staging' }}\n- Scenario: ${{ github.event.inputs.scenario || 'smoke' }}\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
